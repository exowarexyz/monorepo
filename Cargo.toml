[workspace]
members = [
    "server",
    "conformance",
    "sdk/rs",
    "examples/simulator",
    "qmdb/rs",
    "qmdb/rs/wasm",
    "simplex/rs",
    "simplex/rs/wasm",
    "sql/rs",
    "integration",
    "validation",
]
resolver = "2"

[workspace.package]
version = "2026.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://exoware.xyz"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
redundant_clone = "warn"
undocumented_unsafe_blocks = "deny"
use_self = "warn"
missing_const_for_fn = "warn"
multiple_inherent_impl = "deny"
unused_async = "warn"
large_futures = "warn"

[workspace.dependencies]
exoware-qmdb = { version = "2026.9.0", path = "qmdb/rs" }
exoware-sdk = { version = "2026.9.0", path = "sdk/rs" }
exoware-server = { version = "2026.9.0", path = "server" }
exoware-sql = { version = "2026.9.0", path = "sql/rs" }
tokio = "1.43.0"
clap = "4.5.18"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
thiserror = "2.0.12"
axum = "0.8.1"
base64 = "0.22.1"
hex = "0.4"
regex = "1"
commonware-codec = "2026.10.0"
commonware-coding = "2026.10.0"
commonware-actor = "2026.10.0"
commonware-allocator = "2026.10.0"
commonware-consensus = "2026.10.0"
commonware-cryptography = "2026.10.0"
commonware-glue = "2026.10.0"
commonware-macros = "2026.10.0"
commonware-math = "2026.10.0"
commonware-parallel = "2026.10.0"
commonware-p2p = "2026.10.0"
commonware-resolver = "2026.10.0"
commonware-runtime = "2026.10.0"
commonware-storage = "2026.10.0"
commonware-utils = "2026.10.0"
rocksdb = "0.24.0"
rlimit = "0.11.0"
rand = "0.10.2"
parking_lot = "0.12.5"
futures = "0.3.30"
reqwest = "0.13.4"
serde = "1.0.219"
tempfile = "3.10.1"
http = "1.3.1"
tower-http = { version = "0.5.2", features = ["cors"] }
bytes = "1"
connectrpc = { version = "0.9.0", features = ["client", "client-tls", "axum"] }
connectrpc-build = "0.9.0"
hyper = { version = "1", features = ["full"] }
rustls-platform-verifier = "0.7.0"
buffa = { version = "0.9.1", features = ["json"] }
buffa-codegen = "0.9.1"
buffa-types = { version = "0.9.1", features = ["json"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
anyhow = "1"
async-trait = "0.1"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
overflow-checks = true
