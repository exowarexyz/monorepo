[package]
name = "exoware-sdk"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
description = "Interact with the Exoware API in Rust."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/exowarexyz/monorepo/tree/main/sdk/rs"
documentation = "https://docs.rs/exoware-sdk"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body = "1"
http-body-util = { workspace = true }
regex = { workspace = true }
commonware-codec = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tower = { workspace = true }
zstd = "0.13"

# The client and its transports open sockets, so wasm32 builds leave them out.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
connectrpc = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http2", "tokio"] }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rustls-platform-verifier = { workspace = true }
tokio = { workspace = true, features = ["full"] }
cookie_store = { version = "0.22.1", default-features = false }
psl = "2.1.212"

# connectrpc without its socket transports. Keep the version equal to the workspace entry.
[target.'cfg(target_arch = "wasm32")'.dependencies]
connectrpc = { version = "0.9.0" }

[build-dependencies]
buffa-codegen = { workspace = true }
connectrpc-build = { workspace = true }

[dev-dependencies]
commonware-macros = { workspace = true }
criterion = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "response_compression"
harness = false
