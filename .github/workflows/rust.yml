name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UDEPS_VERSION: 0.1.57
  NIGHTLY_VERSION: nightly-2026-06-21

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure swap
        uses: ./.github/actions/swap
      - name: Run setup
        uses: ./.github/actions/setup
      - name: Install nightly Rust toolchain
        run: rustup toolchain install ${{ env.NIGHTLY_VERSION }} && rustup component add --toolchain ${{ env.NIGHTLY_VERSION }} rustfmt
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Fmt
        run: cargo +${{ env.NIGHTLY_VERSION }} fmt --all -- --check
      - name: Check docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: "TEMP measurement: disk, swap, target size"
        if: always()
        run: |
          df -h /
          free -h
          grep -E '^pswp(in|out) ' /proc/vmstat
          du -sh target ~/.cargo 2>/dev/null || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure swap
        uses: ./.github/actions/swap
      - name: Run setup
        uses: ./.github/actions/setup
      - name: Run tests
        run: cargo test --verbose
      - name: "TEMP measurement: disk, swap, target size"
        if: always()
        run: |
          df -h /
          free -h
          grep -E '^pswp(in|out) ' /proc/vmstat
          du -sh target ~/.cargo 2>/dev/null || true

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure swap
        uses: ./.github/actions/swap
      - name: Install nightly Rust toolchain
        run: rustup toolchain install ${{ env.NIGHTLY_VERSION }}
      - name: Verify toolchain
        run: cargo +${{ env.NIGHTLY_VERSION }} --version && rustc +${{ env.NIGHTLY_VERSION }} --version
      # cargo-udeps builds with `-Z binary-dep-depinfo`, which makes cargo treat the toolchain's
      # own files as build inputs and compare their timestamps. rustup stamps them with the
      # install time, so a fresh install makes every cached crate look stale and udeps rebuilds
      # everything. Pinning the timestamps to a fixed old date lets the cache be reused.
      - name: Pin nightly toolchain timestamps
        run: find "$(rustc +${{ env.NIGHTLY_VERSION }} --print sysroot)" -exec touch -h -t 200001010000 {} +
      - name: Run setup
        uses: ./.github/actions/setup
      - name: Install cargo-udeps
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps@${{ env.UDEPS_VERSION }}
      - name: Check for unused dependencies
        run: cargo +${{ env.NIGHTLY_VERSION }} udeps --all-targets
      - name: "TEMP measurement: disk, swap, target size"
        if: always()
        run: |
          df -h /
          free -h
          grep -E '^pswp(in|out) ' /proc/vmstat
          du -sh target ~/.cargo 2>/dev/null || true
