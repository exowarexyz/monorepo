name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UDEPS_VERSION: 0.1.57
  CARGO_COOLDOWN_VERSION: 0.3.4
  NIGHTLY_VERSION: nightly-2026-06-21

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check disk space and configure swap
        uses: ./.github/actions/disk
      - name: Run setup
        uses: ./.github/actions/setup
      - name: Install nightly Rust toolchain
        run: rustup toolchain install ${{ env.NIGHTLY_VERSION }} && rustup component add --toolchain ${{ env.NIGHTLY_VERSION }} rustfmt
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Fmt
        run: cargo +${{ env.NIGHTLY_VERSION }} fmt --all -- --check
      - name: Check docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check disk space and configure swap
        uses: ./.github/actions/disk
      - name: Run setup
        uses: ./.github/actions/setup
      - name: Run tests
        run: cargo test --verbose

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check disk space and configure swap
        uses: ./.github/actions/disk
      - name: Install nightly Rust toolchain
        run: rustup toolchain install ${{ env.NIGHTLY_VERSION }}
      - name: Verify toolchain
        run: cargo +${{ env.NIGHTLY_VERSION }} --version && rustc +${{ env.NIGHTLY_VERSION }} --version
      # cargo-udeps builds with `-Z binary-dep-depinfo`, which makes cargo treat the toolchain's
      # own files as build inputs and compare their timestamps. rustup stamps them with the
      # install time, so a fresh install makes every cached crate look stale and udeps rebuilds
      # everything. Pinning the timestamps to a fixed old date lets the cache be reused.
      - name: Pin nightly toolchain timestamps
        run: find "$(rustc +${{ env.NIGHTLY_VERSION }} --print sysroot)" -exec touch -h -t 200001010000 {} +
      # The cache key only fingerprints the stable toolchain, but udeps compiles with nightly.
      # Without the pin in the key, bumping NIGHTLY_VERSION would restore an exact match full of
      # artifacts from the old nightly, rebuild them, and never save the result (rust-cache skips
      # saving after an exact hit).
      - name: Run setup
        uses: ./.github/actions/setup
        with:
          additional-cache-key: ${{ env.NIGHTLY_VERSION }}
      - name: Install cargo-udeps
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-udeps@${{ env.UDEPS_VERSION }}
      - name: Check for unused dependencies
        run: cargo +${{ env.NIGHTLY_VERSION }} udeps --all-targets

  # Rejects Cargo.lock changes that pull in a crate version published less than 7 days ago.
  # Versions already locked on the base branch are exempt. See cooldown.toml.
  cooldown:
    name: Cooldown
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Check out the PR head (not the merge commit) with full history, so the script can
      # find the merge base with the target branch.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install cargo-cooldown
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-cooldown@${{ env.CARGO_COOLDOWN_VERSION }}
      - name: Check dependency cooldown
        env:
          COOLDOWN_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./.github/scripts/check_dependency_cooldown.sh
