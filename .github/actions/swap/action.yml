name: Configure Swap
description: Give Linux runners 8GB of swap so memory spikes during large builds spill to disk instead of failing.
runs:
  using: composite
  steps:
    - name: Configure swap (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo swapoff -a
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo swapon --show
