[package]
name = "exoware-validation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Validate an Exoware deployment."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/exowarexyz/monorepo/tree/main/validation"
documentation = "https://docs.rs/exoware-validation"

[features]
default = ["cli"]
cli = [
    "dep:exoware-sdk", "dep:tokio", "dep:futures", "dep:rand",
    "dep:chrono", "dep:tracing", "dep:tracing-subscriber", "dep:clap",
    "dep:connectrpc", "dep:http", "dep:buffa",
]

[dependencies]
buffa = { workspace = true, optional = true }
bytes = { workspace = true }
sha2 = "0.11"
exoware-sdk = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
futures = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
clap = { workspace = true, features = ["derive"], optional = true }
anyhow = { workspace = true }
hex = { workspace = true }
connectrpc = { workspace = true, optional = true }
http = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }

[[bin]]
name = "validation"
path = "src/main.rs"
required-features = ["cli"]
