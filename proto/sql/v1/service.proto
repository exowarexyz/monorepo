syntax = "proto3";

package sql.v1;

import "sql/v1/query.proto";
import "sql/v1/schema.proto";
import "sql/v1/stream.proto";

// SQL queries and ingest subscriptions over a server-side `KvSchema`.
// Results carry their Arrow schemas and column buffers in IPC streams.
service Service {
  // Evaluate a compiled scalar predicate against every incoming batch that touches
  // `table`'s primary-key family. Emits one `SubscribeResponse` per
  // matched batch containing just the rows that satisfied the predicate.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Ad-hoc unary SQL against the server-side session. Useful for inspecting
  // the current table state alongside the live subscription.
  rpc Query(QueryRequest) returns (QueryResponse);

  // Describe every registered table. Carries KV-specific metadata
  // (primary-key order, secondary indexes with their layout + cover columns)
  // that DataFusion's `information_schema` doesn't surface.
  rpc Tables(TablesRequest) returns (TablesResponse);
}
