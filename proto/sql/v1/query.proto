syntax = "proto3";

package sql.v1;

import "buf/validate/validate.proto";

// Ad-hoc SQL statement.
message QueryRequest {
  string sql = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 65535
  ];

  // Minimum Store sequence required by reads in this query.
  optional uint64 min_sequence_number = 2;
}

// Result set from `Query`.
message QueryResponse {
  // Complete Arrow IPC stream containing the result schema and record batches.
  // The schema is present even when the query returns no rows.
  bytes results = 1;

  // Highest Store sequence observed. Queries that skip Store reads return
  // the requested floor.
  uint64 sequence_number = 3;
}
